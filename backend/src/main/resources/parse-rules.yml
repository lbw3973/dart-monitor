# 섹션 추출 룰 — AASSOCNOTE(문서 내 구조 ID)로 매칭한다.
# AASSOCNOTE는 '서식 내 위치' 기반이라 서식이 다르면 같은 ID라도 의미가 다르다.
#   예) 약식 D-1-4-0-0 = 변동[변경]사유,  일반 D-1-4-0-0 = 보유목적
# expect(제목)는 검증용이며 불일치해도 실패시키지 않고 경고만 남긴다.
dart:
  rules:
    MAJOR_HOLDING_SIMPLE:
      scope: PART1
      sections:
        - { sectionNo: "3", id: "D-1-3-0-0", expect: "보유주식등의 수 및 보유비율" }
        - { sectionNo: "4", id: "D-1-4-0-0", expect: "변동[변경]사유" }
    MAJOR_HOLDING_GENERAL:
      scope: PART1
      sections:
        - { sectionNo: "3", id: "D-1-3-0-0", expect: "보유주식등의 수 및 보유비율" }
        - { sectionNo: "4", id: "D-1-4-0-0", expect: "보유목적" }
        - { sectionNo: "5", id: "D-1-5-0-0", expect: "변동[변경]사유" }
    EXEC_OWNERSHIP:
      scope: DOCUMENT          # 부(部) 구조가 없어 문서 전체가 범위
      sections:
        - { sectionNo: "3", id: "D-0-1-3-1", expect: "가. 소유 특정증권등의 수 및 소유비율" }
        - { sectionNo: "3", id: "D-0-1-3-2", expect: "나. 특정증권등의 종류별 소유내역" }
        - { sectionNo: "3", id: "D-0-1-3-3", expect: "다. 세부변동내역" }

    # ── 정기공시 ──
    # 사업·반기·분기가 목차 ID를 완전히 공유한다(M8 발견 1, 4건 대조).
    # 그래서 룰은 BUSINESS_REPORT에 한 번만 쓰고 YAML 앵커(&periodic)로 나머지 둘에 붙인다.
    # 세 곳에 복사하면 한 곳만 고쳤을 때 특정 서식에서 섹션이 조용히 빠진다.
    # 섹션을 바꿀 때는 아래 sections 한 곳만 고치면 3종에 모두 반영된다.
    #
    # sectionNo는 화면 표시 순서다(section_no ASC 정렬). 문서의 장 번호(VII, X)를 쓰면
    # 문자열 정렬이 뒤틀리므로 쓰지 않는다. 지분 정보 관련성이 높은 순으로 1~3을 부여했다.
    #
    # 재무제표·주석은 제외한다 — 주석 하나가 표 750개 / 1.8MB라 DB가 감당하지 못한다.
    # 장(章) 단위 ID(D-0-3-0-0 등)는 하위 절을 통째로 포함하므로 절 단위로만 지정한다.
    BUSINESS_REPORT: &periodic
      scope: DOCUMENT
      sections:
        - { sectionNo: "1", id: "D-0-7-0-0",  expect: "주주에 관한 사항" }
        - { sectionNo: "2", id: "D-0-1-4-0",  expect: "주식의 총수 등" }
        - { sectionNo: "3", id: "D-0-10-0-0", expect: "대주주 등과의 거래내용" }
        # 장(章) 전체라 하위 7개 절(L-0-2-*)이 함께 들어온다. 절을 따로 지정하면 중복된다.
        # 회사 규모에 따라 편차가 극심하다 — 실측: 리츠 1KB / 중형주 61~95KB / SK 2,089KB.
        # 지분 정보와 직접 관련이 없어 맨 뒤에 둔다(sectionNo가 화면 순서다).
        - { sectionNo: "4", id: "D-0-2-0-0",  expect: "사업의 내용" }
    HALF_YEAR_REPORT: *periodic
    QUARTER_REPORT: *periodic
