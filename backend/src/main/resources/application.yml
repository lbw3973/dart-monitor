spring:
  config:
    import: classpath:parse-rules.yml
  application:
    name: dart-monitor
  datasource:
    url: jdbc:postgresql://localhost:5433/dart
    username: dart
    password: dart
  jpa:
    hibernate:
      ddl-auto: validate          # 스키마는 Flyway가 소유한다
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true

dart:
  api-key: ${DART_API_KEY}
  base-url: https://opendart.fss.or.kr/api
  detail-types: [D001, D002]
  # 저장 대상 상장 구분 — Y=코스피, K=코스닥, N=코넥스, E=기타·상장폐지
  corp-classes: [Y, K]
  poll-interval: 60s
  # DART 전자접수는 평일 07:30~19:00뿐이다. 그 밖의 폴링은 전부 헛돈다.
  # 따옴표 필수 — YAML이 07:00을 60진수 정수(420)로 읽는다.
  active-from: "07:00"
  active-to: "19:30"              # 당일접수 마감(18:00) 후 90분 여유
  weekend-poll: false
  morning-lookback-days: 3        # 그날 첫 폴링만 이만큼 거슬러 조회 (월요일이면 금·토·일)
  lookback-days: 1                # 기동 캐치업이 '폴러가 자력으로 메울 수 있는 범위'로 삼는 일수
  catch-up-max-days: 30           # 기동 시 소급 상한. 0이면 비활성
  raw-dir: ${DART_RAW_DIR:./raw}
  fetch-concurrency: 2
  # DART가 원본을 배치로 공개해 준비 시점이 일정하지 않다(접수 후 25~40분 관측).
  # 그래서 점증 간격이 아니라 균등 간격으로 확인한다.
  fetch-retry-interval: 5m
  # app_setting 테이블의 'fetch.max-retry' 가 있으면 그 값이 우선한다. 여기는 폴백.
  max-retry: 18

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/auth/kakao/callback}
  app-base-url: ${APP_BASE_URL:http://localhost:5173}
  session-ttl: 14d
  cookie-secure: ${COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    kr.irm.dart: DEBUG
